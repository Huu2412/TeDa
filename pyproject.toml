[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "teda"
version = "0.0.2"
description = "TeDA: Text-Guided and Dialect-Aware Representation Learning for Vietnamese ASR with Audio-Only Inference"
requires-python = ">=3.10"
# torch and torchaudio are preinstalled on Kaggle and deliberately NOT listed (pip must not replace them).
dependencies = [
    "numpy",
    "soundfile",
    "pyarrow",
    "pyyaml",
    "huggingface_hub",
    "sentencepiece",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
