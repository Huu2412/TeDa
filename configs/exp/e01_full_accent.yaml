# E01: E00 full fine-tune (e00_full_ft) + accent head. The ONLY difference from e00_full_ft is model.accent,
# so a WER gap is attributable to the accent task. Do not add train.* overrides here (frames / accum / lr / warmup
# must stay equal to e00_full_ft); python scripts/compare_runs.py outputs/e00_full_ft outputs/e01_full_accent
# prints every setting that differs.
exp_name: e01_full_accent
encoder:
  freeze_embed: false
  freeze_layers: []
  freeze_after_norm: false
model:
  accent:
    enabled: true
